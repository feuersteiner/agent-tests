id: no-informal-english
title: No informal English
description: Customer-facing English prose uses formal vocabulary.
source: sha256:8750e6112cce3226eb5bdb6fe6bc1b96dc16a66a3c5d4d58e2d1978b47090dbd
triggers:
  path:
    match:
      - 'src/**/*.md'
      - 'src/**/*.txt'
checks:
  - id: formal-vocabulary
    message: Customer-facing prose contains informal English.
    fix: Replace gonna, wanna, or gotta with going to, want to, or have to.
    fast:
      match: '\b([Gg]onna|[Ww]anna|[Gg]otta)\b'
evals:
  - name: Informal customer documentation
    path: src/help/getting-started.md
    content: We are gonna save your changes.
    expect: fail
  - name: Formal customer documentation
    path: src/help/getting-started.md
    content: We are going to save your changes.
    expect: pass
  - name: Source code is outside the prose scope
    path: src/internal.ts
    content: const phrase = 'gonna';
    expect: skip
