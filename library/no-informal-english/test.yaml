id: no-informal-english
title: No informal English
description: Customer-facing English prose uses formal vocabulary.
source: sha256:8750e6112cce3226eb5bdb6fe6bc1b96dc16a66a3c5d4d58e2d1978b47090dbd
select:
  type: files
  # Reference layout: public English prose lives in src/help/.
  # Installing agents adapt these globs to the repository's public prose.
  glob: ['src/help/**/*.md', 'src/help/**/*.txt']
checks:
  - id: formal-vocabulary
    description: Public English prose uses formal vocabulary.
    error: Replace gonna, wanna, or gotta with going to, want to, or have to.
    grep: '\b([Gg]onna|[Ww]anna|[Gg]otta)\b'
evals:
  - name: Informal customer documentation
    path: src/help/getting-started.md
    content: We are gonna save your changes.
    expect: fail
  - name: Formal customer documentation
    path: src/help/getting-started.md
    content: We are going to save your changes.
    expect: pass
  - name: Source code is outside the prose scope
    path: src/internal.ts
    content: const phrase = 'gonna';
    expect: skip
  - name: Internal Markdown is outside the reference public prose scope
    path: src/internal/design-notes.md
    content: We are gonna refactor the cache.
    expect: skip
  - name: Internal plain text is outside the reference public prose scope
    path: src/internal/design-notes.txt
    content: We gotta refactor the cache.
    expect: skip
