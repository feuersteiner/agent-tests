id: sample-no-debugger
title: 'Sample: no debugger statements'
description: Smoke definition rejecting debugger statements ending with a semicolon.
tags: [sample]
triggers:
  - id: javascript-typescript
    description: Select JavaScript and TypeScript source files.
    glob: '**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
checks:
  - id: no-debugger
    description: Reject the word debugger followed by optional whitespace and a semicolon.
    error: Remove the debugger statement before shipping the source file.
    grep: '\bdebugger\s*;'
evals:
  - name: Regular implementation passes
    path: src/answer.ts
    content: |
      export const answer = 42;
    expect: pass
  - name: Debugger statement fails
    path: src/answer.ts
    content: |
      debugger;
      export const answer = 42;
    expect: fail
  - name: Markdown debugger example is out of scope
    path: docs/debugging.md
    content: 'debugger;'
    expect: skip
