id: sample-no-todo
title: 'Sample: no TODO markers'
description: Smoke definition rejecting uppercase TODO markers in JavaScript and TypeScript.
tags: [sample]
triggers:
  - id: javascript-typescript
    description: Select JavaScript and TypeScript source files.
    glob: '**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}'
checks:
  - id: no-todo
    description: Reject the uppercase word TODO anywhere in source text.
    error: Resolve the TODO or track the task outside the source file.
    grep: '\bTODO\b'
evals:
  - name: Completed implementation passes
    path: src/answer.ts
    content: |
      export const answer = 42;
    expect: pass
  - name: TODO comment fails
    path: src/answer.ts
    content: |
      // TODO: implement the answer.
      export const answer = 0;
    expect: fail
  - name: Markdown TODO is out of scope
    path: docs/notes.md
    content: 'TODO: document the answer.'
    expect: skip
