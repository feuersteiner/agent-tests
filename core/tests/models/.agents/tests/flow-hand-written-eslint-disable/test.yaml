version: 1
id: flow-hand-written-eslint-disable
title: No file-wide ESLint disable in hand-written code
description: Hand-written code never disables ESLint rules for a whole file; generated files may.
select:
  glob: 'src/**/*.ts'
  decide: 'This file was written by hand, not generated by a tool.'
assert:
  - id: no-file-wide-disable
    description: The file has no eslint-disable block comment that turns rules off for the whole file.
    error: Remove the file-wide eslint-disable; fix the code or disable the rule for one line with eslint-disable-next-line.
    grep: 'eslint-disable(?!-)'
