id: margin-policy
title: Preserve required margins
description: Proposals must preserve a 30 percent final margin after discounts and concessions.
triggers:
  - id: scope
    description: Proposals must preserve a 30 percent final margin after discounts and concessions.
    glob: business/proposal.md
checks:
  - id: margin-policy
    description: Proposals must preserve a 30 percent final margin after discounts and concessions.
    error: Proposals must preserve a 30 percent final margin after discounts and concessions.
    reason: The proposal preserves the required 30 percent margin after every concession.
evals:
  - name: approved example
    path: business/proposal.md
    content: |
      Required margin: 30%.
      Final margin: 35%.
    expect: pass
  - name: violation
    path: business/proposal.md
    content: |
      Required margin: 30%.
      Final margin: 20%.
    expect: fail
  - name: outside scope
    path: unrelated/example.txt
    content: |
      Required margin: 30%.
      Final margin: 20%.
    expect: skip
