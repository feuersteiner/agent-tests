id: brand-voice
title: Formal brand wording
description: Customer copy must use formal language; internal campaign identifiers are allowed.
triggers:
  - id: content
    description: Published brand copy.
    glob: content/**/*.md
  - id: marketing
    description: Marketing brand copy.
    glob: marketing/**/*.md
checks:
  - id: brand-voice
    description: Customer copy must use formal language; internal campaign identifiers are allowed.
    error: Customer copy must use formal language; internal campaign identifiers are allowed.
    grep:
      - \bhey\b
      - \bwanna\b
    ask: The copy uses formal language appropriate to the brand.
evals:
  - name: approved example
    path: content/brand.md
    content: |
      Acme vous accompagne.
    expect: pass
  - name: violation
    path: content/brand.md
    content: |
      hey folks, wanna buy?
    expect: fail
  - name: outside scope
    path: unrelated/example.txt
    content: |
      hey folks, wanna buy?
    expect: skip
  - name: internal identifier is an exception
    path: content/campaign.md
    content: |
      hey is an internal campaign identifier
    expect: pass
  - name: second trigger can select the source
    path: marketing/campaign.md
    content: |
      hey folks, wanna buy?
    expect: fail
