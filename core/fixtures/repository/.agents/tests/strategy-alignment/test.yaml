id: strategy-alignment
title: Respect the segment exit
description: Plans must follow the approved exit from the consumer segment.
triggers:
  - id: scope
    description: Plans must follow the approved exit from the consumer segment.
    glob: business/strategy.md
checks:
  - id: strategy-alignment
    description: Plans must follow the approved exit from the consumer segment.
    error: Plans must follow the approved exit from the consumer segment.
    ask: This plan respects the approved exit from the consumer segment.
evals:
  - name: approved example
    path: business/strategy.md
    content: |
      Approved policy: exit the consumer segment.
      Plan: invest in enterprise accounts.
    expect: pass
  - name: violation
    path: business/strategy.md
    content: |
      Approved policy: exit the consumer segment.
      Plan: acquire more consumer accounts.
    expect: fail
  - name: outside scope
    path: unrelated/example.txt
    content: |
      Approved policy: exit the consumer segment.
      Plan: acquire more consumer accounts.
    expect: skip
