id: payment-retries
title: Payment retries preserve identity
description: Payment retries must reuse the original idempotency key.
triggers:
  - id: scope
    description: Payment retries must reuse the original idempotency key.
    glob: src/payments/**/*.ts
checks:
  - id: payment-retries
    description: Payment retries must reuse the original idempotency key.
    error: Payment retries must reuse the original idempotency key.
    grep: idempotencyKey:\s*randomUUID\(
evals:
  - name: approved example
    path: src/payments/retry.ts
    content: |
      export const retry = (idempotencyKey: string) => ({ idempotencyKey });
    expect: pass
  - name: violation
    path: src/payments/retry.ts
    content: |
      export const retry = () => ({ idempotencyKey: randomUUID() });
    expect: fail
  - name: outside scope
    path: unrelated/example.txt
    content: |
      export const retry = () => ({ idempotencyKey: randomUUID() });
    expect: skip
