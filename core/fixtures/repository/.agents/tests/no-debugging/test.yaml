id: no-debugging
title: No debugging statements
description: Production TypeScript must not contain console.log or debugger statements.
triggers:
  - id: scope
    description: Production TypeScript must not contain console.log or debugger statements.
    glob: src/**/*.ts
checks:
  - id: no-debugging
    description: Production TypeScript must not contain console.log or debugger statements.
    error: Production TypeScript must not contain console.log or debugger statements.
    grep:
      - \bconsole\.log\s*\(
      - \bdebugger\s*;
evals:
  - name: approved example
    path: src/diagnostics.ts
    content: |
      export const ready = true;
    expect: pass
  - name: violation
    path: src/diagnostics.ts
    content: |
      console.log("payment payload");
    expect: fail
  - name: outside scope
    path: unrelated/example.txt
    content: |
      console.log("payment payload");
    expect: skip
  - name: debugger statement
    path: src/diagnostics.ts
    content: |
      debugger;
    expect: fail
