id: documentation-contract
title: Documentation matches implementation
description: The documented deletion timing agrees with the implementation excerpt supplied in this contract.
triggers:
  - id: scope
    description:
      The documented deletion timing agrees with the implementation excerpt supplied in this
      contract.
    glob: docs/deletion-contract.md
checks:
  - id: documentation-contract
    description:
      The documented deletion timing agrees with the implementation excerpt supplied in this
      contract.
    error: The documented deletion timing agrees with the implementation excerpt supplied in this
      contract.
    reason: The documented deletion timing agrees with the included implementation contract.
evals:
  - name: approved example
    path: docs/deletion-contract.md
    content: |
      Implementation contract: HTTP 202; deletion is queued.
      Documentation: deletion is queued.
    expect: pass
  - name: violation
    path: docs/deletion-contract.md
    content: |
      Implementation contract: HTTP 202; deletion is queued.
      Documentation: deletion is immediate.
    expect: fail
  - name: outside scope
    path: unrelated/example.txt
    content: |
      Implementation contract: HTTP 202; deletion is queued.
      Documentation: deletion is immediate.
    expect: skip
