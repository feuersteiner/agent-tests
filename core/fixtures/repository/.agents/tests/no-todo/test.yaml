id: no-todo
title: No TODO markers
description: TypeScript sources contain no unfinished TODO markers.
triggers:
  - id: typescript
    description: TypeScript source files.
    glob: 'src/**/*.ts'
checks:
  - id: no-todo
    description: Reject TODO markers.
    error: Resolve the TODO marker.
    grep: '\bTODO\b'
evals:
  - name: completed source
    path: src/answer.ts
    content: 'export const answer = 42;'
    expect: pass
  - name: unfinished source
    path: src/answer.ts
    content: '// TODO: finish'
    expect: fail
  - name: documentation is excluded
    path: docs/notes.md
    content: TODO
    expect: skip
